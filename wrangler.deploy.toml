# 本文件是「fork 的部署分支专属覆盖层」，与上游 main 的 wrangler.toml 分离维护。
#
# 上游 wrangler.toml 用 name="openlist-tsworkers" 且不含自定义域名/KV id。
# 直接把它拉过来部署会覆盖掉 openlist-aki 的实际接线，所以：
#   - sync-upstream.yml 每次同步后，用本文件覆盖 wrangler.toml
#   - 本文件不被上游改动影响
name = "openlist-aki"
main = "src/backend/worker.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

# 不用 workers.dev（本账号该子域不可用），统一走自定义域名
workers_dev = false
preview_urls = false

[[routes]]
pattern = "openlist.itsuhiro.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
ENVIRONMENT = "production"
DB_FORMAT = "map"
DB_DRIVER = "auto"

# KV 绑定（map/key 模式的持久化存储）—— 显式 id，保证 CI 复现性
# （不用 wrangler 4.x 的 automatic provisioning，避免 CI 里凭空建出第二个 namespace）
[[kv_namespaces]]
binding = "KV"
id = "9380f3d853af491a8fe8fdfc15fb1609"
